name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android build platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install web dependencies
        run: npm ci
      - name: Build and synchronize the Capacitor app
        run: npm run cap:sync
      - name: Assert the APK cannot embed itself
        run: test ! -d dist/downloads
      - name: Run deterministic native tests and assemble debug APK
        working-directory: android
        run: ./gradlew test assembleDebug --no-daemon
      - name: Write APK SHA-256
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: quietwall-debug-apk
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
  device-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install web dependencies and sync Android
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run cap:sync
          npm run build
      - name: Run every claim against clean browser and Android sandboxes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -netfast -dns-server 1.1.1.1,8.8.8.8
          script: |
            adb emu network speed full
            adb emu network delay none
            adb shell cmd connectivity airplane-mode disable
            adb shell svc data enable
            adb shell svc wifi enable
            adb shell settings put global private_dns_mode off
            node scripts/run-claim-registry.mjs
